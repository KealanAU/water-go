# Local development stack: TimescaleDB plus the ingester and api binaries.
# Both app services build from the same image and differ only in `command:`.
services:
  # TimescaleDB (Postgres + hypertables). Data persists in the pgdata volume.
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: water
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # App services wait on this healthcheck before starting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Poller + normalizer: fetches from NVE and writes to the database.
  ingester:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/ingester"]
    environment:
      DATABASE_URL: postgres://water:water@db:5432/water?sslmode=disable
      NVE_API_KEY: ${NVE_API_KEY}
      NVE_BASE_URL: ${NVE_BASE_URL:-https://hydapi.nve.no/api/v1}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      STATION_IDS: ${STATION_IDS:-2.32.0}
      PARAMETERS: ${PARAMETERS:-1000,1001,1003}
      RESOLUTION_TIME: ${RESOLUTION_TIME:-60}
      LOOKBACK: ${LOOKBACK:-24h}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Read-only HTTP API over the stored data.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: postgres://water:water@db:5432/water?sslmode=disable
      NVE_API_KEY: ${NVE_API_KEY}
      API_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

# Named volume so database contents survive `docker compose down`.
volumes:
  pgdata:
