services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
      POSTGRES_DB: water
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # App services wait on this healthcheck before starting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingester:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/ingester"]
    environment:
      DATABASE_URL: postgres://water:water@db:5432/water?sslmode=disable
      NVE_API_KEY: ${NVE_API_KEY}
      NVE_BASE_URL: ${NVE_BASE_URL:-https://hydapi.nve.no/api/v1}
      POLL_INTERVAL: ${POLL_INTERVAL:-5m}
      STATION_IDS: ${STATION_IDS:-2.32.0}
      PARAMETERS: ${PARAMETERS:-1000,1001,1003}
      RESOLUTION_TIME: ${RESOLUTION_TIME:-60}
      LOOKBACK: ${LOOKBACK:-24h}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-3}
      ANOMALY_WINDOW: ${ANOMALY_WINDOW:-100}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      METRICS_ADDR: ":9090"
    # Metrics endpoint (/metrics, /healthz), scraped by Prometheus on the
    # internal network and exposed on the host for convenience.
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/api"]
    environment:
      DATABASE_URL: postgres://water:water@db:5432/water?sslmode=disable
      API_ADDR: ":8080"
      API_KEYS: ${API_KEYS:-}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-10}
      API_RATE_BURST: ${API_RATE_BURST:-20}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    # Host 9091 -> container 9090 to avoid clashing with the ingester's 9090.
    ports:
      - "9091:9090"
    depends_on:
      - ingester
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      # Local demo only; change for anything real.
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
