version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    misspell:
      locale: US
    revive:
      rules:
        # Doc comments are only written where names aren't self-explanatory,
        # so don't require them on every exported symbol.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    # sqlc-generated code is not hand-maintained.
    paths:
      - internal/db

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/db
